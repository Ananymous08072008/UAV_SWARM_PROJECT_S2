name: Bug report
description: Something in the simulation, swarm logic, dashboard or telemetry misbehaves
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Exact command to reproduce
      description: Include scenario file, `--mode`, `--seed` and `--duration` if you used them.
      render: bash
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [swarm, core, simulation, telemetry, dashboard, experiments, docs, ci]
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Python version and OS
      placeholder: "3.12 / Windows 11"
  - type: textarea
    id: logs
    attributes:
      label: Console output or run folder contents
      description: Paste the summary or attach `events.csv` / `summary.json` from `results/<run>/`.
