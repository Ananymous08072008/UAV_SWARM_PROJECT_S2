# Runs the test suite and a full headless mission on GitHub's servers for every
# push and pull request, so nobody can merge a change that breaks main.
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the test suite
        env:
          MPLBACKEND: Agg      # matplotlib has no display on a CI runner
        run: python -m pytest -q

      - name: Smoke-test a full headless mission (adaptive and baseline)
        env:
          MPLBACKEND: Agg
        run: |
          python main.py --quiet --no-results
          python main.py --mode baseline --quiet --no-results
